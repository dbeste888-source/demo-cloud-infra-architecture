<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620" role="img" aria-label="Structurizr account network preview">
  <rect width="1180" height="620" fill="#f8fafc"/>
  <text x="40" y="54" font-family="Segoe UI, Arial" font-size="26" font-weight="700" fill="#172033">Structurizr Preview: Service Hosting Account A</text>
  <text x="40" y="84" font-family="Segoe UI, Arial" font-size="15" fill="#617083">Account and network-level architecture. Service and data-flow details are linked below.</text>
  <rect x="52" y="122" width="780" height="420" rx="10" fill="#eef7ee" stroke="#6aa36f"/>
  <text x="82" y="160" font-family="Segoe UI, Arial" font-size="20" font-weight="700" fill="#172033">vpc-service-a-prod / ap-northeast-1</text>
  <g font-family="Segoe UI, Arial" font-size="15" fill="#172033">
    <rect x="96" y="210" width="190" height="100" rx="8" fill="#fff7df" stroke="#e8c866"/>
    <text x="126" y="250" font-weight="700">Public subnets</text>
    <text x="126" y="278" fill="#617083">ALB, NAT Gateway</text>
    <rect x="356" y="190" width="260" height="140" rx="8" fill="#eaf1ff" stroke="#7aa2e8"/>
    <text x="404" y="234" font-weight="700">Private app subnets</text>
    <text x="392" y="264" fill="#617083">ECS backend, Lambda</text>
    <text x="400" y="292" fill="#617083">VPC endpoints</text>
    <rect x="356" y="380" width="260" height="96" rx="8" fill="#f1edfb" stroke="#b69be6"/>
    <text x="408" y="420" font-weight="700">Isolated data subnets</text>
    <text x="424" y="448" fill="#617083">Aurora PostgreSQL</text>
    <rect x="900" y="180" width="220" height="100" rx="8" fill="#e8f7f2" stroke="#8ac7b6"/>
    <text x="940" y="220" font-weight="700">Shared Engineering</text>
    <text x="936" y="248" fill="#617083">Telemetry, deployment</text>
    <rect x="900" y="360" width="220" height="100" rx="8" fill="#f1edfb" stroke="#b69be6"/>
    <text x="944" y="400" font-weight="700">Data Analysis</text>
    <text x="936" y="428" fill="#617083">Curated data lake</text>
  </g>
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M286 260 L356 260"/>
    <path d="M486 330 L486 380"/>
    <path d="M616 260 C740 260 790 230 900 230"/>
    <path d="M616 430 C738 430 790 410 900 410"/>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>

