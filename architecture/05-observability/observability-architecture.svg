<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-label="Observability draw.io preview">
  <rect width="1400" height="560" fill="#f8fafc"/>
  <text x="42" y="56" font-family="Segoe UI, Arial" font-size="30" font-weight="700" fill="#172033">draw.io Preview: Observability Architecture</text>
  <text x="42" y="88" font-family="Segoe UI, Arial" font-size="16" fill="#617083">Cross-account logs, metrics, traces, dashboards, alerts, and runbook links.</text>
  <g font-family="Segoe UI, Arial" font-size="15" fill="#172033">
    <rect x="80" y="170" width="260" height="170" rx="10" fill="#eaf1ff" stroke="#7aa2e8"/>
    <text x="126" y="220" font-size="18" font-weight="700">Workload accounts</text>
    <text x="130" y="250" fill="#617083">ECS, Lambda, RDS, ALB</text>
    <text x="132" y="280" fill="#617083">application logs and metrics</text>
    <rect x="450" y="170" width="260" height="170" rx="10" fill="#fff7df" stroke="#e8c866"/>
    <text x="522" y="220" font-size="18" font-weight="700">CloudWatch</text>
    <text x="514" y="250" fill="#617083">logs, metrics, alarms</text>
    <text x="518" y="280" fill="#617083">AWS native telemetry</text>
    <rect x="820" y="170" width="300" height="170" rx="10" fill="#e8f7f2" stroke="#8ac7b6"/>
    <text x="870" y="220" font-size="18" font-weight="700">Shared Engineering</text>
    <text x="874" y="250" fill="#617083">Datadog forwarder</text>
    <text x="876" y="280" fill="#617083">AWS integration</text>
    <rect x="1230" y="170" width="130" height="170" rx="10" fill="#ffffff" stroke="#bdc9d8"/>
    <text x="1262" y="220" font-size="18" font-weight="700">Ops</text>
    <text x="1254" y="250" fill="#617083">dashboards</text>
    <text x="1264" y="280" fill="#617083">alerts</text>
    <text x="1255" y="310" fill="#617083">runbooks</text>
  </g>
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M340 255 L450 255"/>
    <path d="M710 255 L820 255"/>
    <path d="M1120 255 L1230 255"/>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>

