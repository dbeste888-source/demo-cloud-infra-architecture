  <text x="40" y="84" font-family="Segoe UI, Arial" font-size="15" fill="#617083">Isolated data-flow layer. High-level data flow can be shown with Mermaid; architecture source stays in draw.io.</text>
  <g font-family="Segoe UI, Arial" font-size="15" fill="#172033">
