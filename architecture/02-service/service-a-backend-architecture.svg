<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="600" viewBox="0 0 1180 600" role="img" aria-label="Service A backend draw.io preview">
  <rect width="1180" height="600" fill="#f8fafc"/>
  <text x="40" y="54" font-family="Segoe UI, Arial" font-size="26" font-weight="700" fill="#172033">draw.io Preview: Service A Backend Architecture</text>
  <text x="40" y="84" font-family="Segoe UI, Arial" font-size="15" fill="#617083">Service backend -> AWS resources -> feature realization. Multi-service communication/data movement belongs here.</text>
  <g font-family="Segoe UI, Arial" font-size="15" fill="#172033">
    <rect x="68" y="210" width="190" height="96" rx="8" fill="#fff7df" stroke="#e8c866"/>
    <text x="104" y="250" font-weight="700">Frontend caller</text>
    <text x="104" y="278" fill="#617083">UI or API client</text>
    <rect x="338" y="190" width="230" height="136" rx="8" fill="#eaf1ff" stroke="#7aa2e8"/>
    <text x="386" y="236" font-weight="700">Service A backend</text>
    <text x="386" y="264" fill="#617083">ECS Fargate API</text>
    <text x="386" y="292" fill="#617083">business logic</text>
    <rect x="648" y="180" width="260" height="156" rx="8" fill="#f1edfb" stroke="#b69be6"/>
    <text x="710" y="226" font-weight="700">AWS resources</text>
    <text x="696" y="254" fill="#617083">Aurora, S3, Secrets</text>
    <text x="710" y="282" fill="#617083">Parameter Store</text>
    <rect x="968" y="208" width="166" height="100" rx="8" fill="#e8f7f2" stroke="#8ac7b6"/>
    <text x="1004" y="248" font-weight="700">Feature</text>
    <text x="996" y="276" fill="#617083">realization</text>
    <rect x="338" y="410" width="570" height="110" rx="8" fill="#fff" stroke="#bdc9d8"/>
    <text x="444" y="454" font-weight="700">Detailed multi-service data flow and communication</text>
    <text x="458" y="484" fill="#617083">Service A -> Data Analysis -> Shared Engineering</text>
  </g>
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M258 258 L338 258"/>
    <path d="M568 258 L648 258"/>
    <path d="M908 258 L968 258"/>
    <path d="M453 326 L453 410"/>
    <path d="M778 336 L778 410"/>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>

